  {"idiom": "大雪", "meaning": "降雪較大", "sentence": "到了大雪，天氣更加寒冷，降雪較大，地面容易積雪。"},
  {"idiom": "冬至", "meaning": "寒冬到來,晝短夜長", "sentence": "冬至這天寒冬到來,晝短夜長，民間有吃湯圓的傳統習俗。"},
  {"idiom": "小寒", "meaning": "天氣開始寒冷", "sentence": "進入小寒，標誌著天氣開始寒冷，需要準備好禦寒衣物。"},
  {"idiom": "大寒", "meaning": "一年中最寒冷的時節", "sentence": "大寒是二十四節氣的最後一個，也是一年中最寒冷的時節。"}
];

let appState = { currentMode: 'flashcard', deck: [], nextRoundDeck: [], currentIndex: 0, stats: { good: 0, bad: 0 }, isQuizAnswered: false, hasVisitedBack: false, round: 1, startTime: null, isWrongTraining: false };
let modeStates = {};

function startApp() { document.getElementById('instruction-overlay').style.display = 'none'; document.getElementById('main-app').style.display = 'flex'; initGame('flashcard'); }
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

/* --- 錯題本 LocalStorage 核心模組 --- */
function getWrongBook() {
  try {
    const data = localStorage.getItem('idiom_wrong_pool');
    return data ? JSON.parse(data) : [];
  } catch (e) { return []; }
}

function saveWrongBook(pool) {
  try { localStorage.setItem('idiom_wrong_pool', JSON.stringify(pool)); } catch (e) {}
  renderWrongBook();
}

function addToWrongBook(item) {
  if (!item) return;
  const word = item.idiom || item.key || item.word || item.question || item.char || "";
  let meaningStr = item.meaning || item.answer || item.translation || item.explanation || "";
  let sentenceStr = item.sentence || item.question || item.original || "";
  let pool = getWrongBook();
  let exist = pool.find(x => (x.idiom || x.key || x.word || x.question || x.char) === word);

  if (exist) {
    exist.wrongCount = (exist.wrongCount || 1) + 1;
    exist.lastWrongTime = new Date().getTime();
  } else {
    pool.push({
      idiom: word,
      meaning: meaningStr,
      sentence: sentenceStr,
      wrongCount: 1,
      lastWrongTime: new Date().getTime(),
      chapter: QUIZ_TITLE
    });
  }
  saveWrongBook(pool);
}

function removeFromWrongBook(word) {
  let pool = getWrongBook();
  pool = pool.filter(x => (x.idiom || x.key || x.word || x.question || x.char) !== word);
  saveWrongBook(pool);
}

function isAutoRemoveEnabled() {
  const cb = document.getElementById('wb-auto-remove');
  return cb ? cb.checked : true;
}

function renderWrongBook() {
  const pool = getWrongBook();
  const currentPool = pool.filter(x => x.chapter === QUIZ_TITLE);
  
  const countBadge = document.getElementById('wb-count-badge');
  if (countBadge) {
    countBadge.innerText = `目前單元共 ${currentPool.length} 個錯題 (累計全部單元共 ${pool.length} 個)`;
  }

  const btnFc = document.getElementById('wb-btn-fc');
  const btnQuiz = document.getElementById('wb-btn-quiz');
  if (btnFc) btnFc.disabled = currentPool.length === 0;
  if (btnQuiz) btnQuiz.disabled = currentPool.length === 0;

  const container = document.getElementById('wrong-list-container');
  if (!container) return;

  if (currentPool.length === 0) {
    container.innerHTML = `<div class="wb-empty-msg">✨ 太棒了！本單元目前沒有任何錯題記錄。繼續保持！</div>`;
    return;
  }

  let html = '';
  currentPool.forEach(item => {
    html += `
      <div class="wb-item-card">
        <div>
          <div class="wb-item-title">
            ${item.idiom}
            <span class="wb-item-count">錯 ${item.wrongCount || 1} 次</span>
          </div>
          <div class="wb-item-meaning">${item.meaning}</div>
        </div>
        <button class="wb-del-btn" title="移出錯題本" onclick="removeFromWrongBook('${(item.idiom || '').replace(/'/g, "\\'")}');">🗑️</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

function clearCurrentWrongBook() {
  if (!confirm("確定要清空『本單元』的所有錯題紀錄嗎？")) return;
  let pool = getWrongBook();
  pool = pool.filter(x => x.chapter !== QUIZ_TITLE);
  saveWrongBook(pool);
}

function copyWrongBook() {
  const pool = getWrongBook().filter(x => x.chapter === QUIZ_TITLE);
  if (pool.length === 0) { alert("目前沒有錯題可複製！"); return; }
  const text = pool.map((x, i) => `${i + 1}. ${x.idiom}：${x.meaning}`).join('\n');
  navigator.clipboard.writeText(text).then(() => alert("已複製本單元錯題至剪貼簿！"));
}

function downloadWrongBook() {
  const pool = getWrongBook().filter(x => x.chapter === QUIZ_TITLE);
  if (pool.length === 0) { alert("目前沒有錯題可下載！"); return; }
  const text = pool.map((x, i) => `${i + 1}. ${x.idiom}：${x.meaning}${x.sentence ? '\n例句/題目：' + x.sentence : ''}`).join('\n\n');
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${QUIZ_TITLE}_錯題本.txt`;
  a.click();
}

function startWrongTraining(mode) {
  const pool = getWrongBook().filter(x => x.chapter === QUIZ_TITLE);
  if (pool.length === 0) { alert("目前沒有錯題可以進行特訓喔！"); return; }
  
  delete modeStates[mode]; 
  appState.isWrongTraining = true;
  appState.currentMode = mode;
  
  const mainData = vocabData;
  
  appState.deck = pool.map(p => {
    let found = mainData.find(v => (v.idiom || v.word || v.key || v.question) === p.idiom);
    return found || p;
  });

  if (mode !== 'flashcard') {
    shuffleArray(appState.deck);
  }

  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  const targetBtn = document.getElementById(`nav-btn-${mode}`) || document.querySelector(`.nav-btn[onclick*="${mode}"]`);
  if (targetBtn) targetBtn.classList.add('active');
  
  document.querySelectorAll('.mode-container').forEach(div => div.classList.remove('active'));
  const targetModeDiv = document.getElementById(`${mode}-mode`);
  if (targetModeDiv) targetModeDiv.classList.add('active');

  appState.nextRoundDeck = []; 
  appState.currentIndex = 0; 
  appState.stats = { good: 0, bad: 0 }; 
  appState.isQuizAnswered = false; 
  appState.hasVisitedBack = false;
  appState.startTime = new Date();

  document.getElementById('summary-area').style.display = 'none';

  const prefix = mode === 'flashcard' ? 'fc' : 'mq';
  const badge = document.getElementById(`${prefix}-round-badge`);
  if (badge) {
    badge.innerText = `🔥 錯題特訓模式 (${appState.deck.length} 題)`;
    badge.style.backgroundColor = "var(--accent)";
  }

  updateStatsUI();
  const cardEl = document.getElementById('card');
  if (cardEl) cardEl.classList.remove('flipped');
  
  if (mode === 'flashcard') {
    loadFlashcard();
  } else if (mode === 'meaningQuiz') {
    loadQuiz();
  }
}

function saveCurrentModeState() {
  const oldMode = appState.currentMode;
  if (!oldMode || oldMode === 'wrongBook') return;

  const summaryArea = document.getElementById('summary-area');
  const summaryVisible = summaryArea && summaryArea.style.display !== 'none';

  const prefix = oldMode === 'flashcard' ? 'fc' : 'mq';
  const badge = document.getElementById(`${prefix}-round-badge`);

  modeStates[oldMode] = {
    appState: JSON.parse(JSON.stringify(appState)),
    summaryVisible: summaryVisible,
    summaryText: document.getElementById('summary-text') ? document.getElementById('summary-text').innerHTML : '',
    sendingStatus: document.getElementById('sending-status') ? document.getElementById('sending-status').innerText : '',
    cardFlipped: document.getElementById('card') ? document.getElementById('card').classList.contains('flipped') : false,
    frontActionsVisible: document.getElementById('front-actions') ? document.getElementById('front-actions').classList.contains('visible') : false,
    badgeText: badge ? badge.innerText : '',
    badgeBg: badge ? badge.style.backgroundColor : ''
  };
}

function initGame(mode, isRetry = false) { 
   delete modeStates[mode];
   appState.isWrongTraining = false;
   if (mode === 'wrongBook') {
     document.querySelectorAll('.mode-container').forEach(div => div.classList.remove('active'));
     const wbMode = document.getElementById('wrongBook-mode');
     if (wbMode) wbMode.classList.add('active');
     renderWrongBook();
     return;
   } 
   appState.currentMode = mode; 
   window.scrollTo(0, 0); 
   appState.startTime = new Date();
   
   if (isRetry && appState.nextRoundDeck.length > 0) { 
       appState.deck = [...appState.nextRoundDeck]; 
       appState.round++; 
   } else { 
       appState.deck = [...vocabData]; 
       appState.round = 1; 
   }
   
   if (mode === 'meaningQuiz') {
       shuffleArray(appState.deck);
   }

   appState.nextRoundDeck = []; appState.currentIndex = 0; appState.stats = { good: 0, bad: 0 }; appState.isQuizAnswered = false; appState.hasVisitedBack = false; 
   document.getElementById('summary-area').style.display = 'none'; 
   document.querySelectorAll('.mode-container').forEach(div => div.classList.remove('active')); 
   document.getElementById(`${mode}-mode`).classList.add('active'); 
   const prefix = mode === 'flashcard' ? 'fc' : 'mq'; 
   const badge = document.getElementById(`${prefix}-round-badge`); 
   if (badge) {
     badge.innerText = isRetry ? `🎯 第 ${appState.round} 輪複習 (只練不熟的)` : `📚 第 1 輪學習 (全部 ${appState.deck.length} 題)`; 
     badge.style.backgroundColor = isRetry ? "var(--warning)" : "var(--primary)"; 
   }
   updateStatsUI(); 
   const cardEl = document.getElementById('card');
   if (cardEl) cardEl.classList.remove('flipped'); 
   
   if (mode === 'flashcard') loadFlashcard(); else if (mode === 'meaningQuiz') loadQuiz(); 
}

function switchMode(newMode) { 
  const oldMode = appState.currentMode;
  if (oldMode === newMode) return;

  if (oldMode && oldMode !== 'wrongBook') {
    saveCurrentModeState();
  }

  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  const targetBtn = document.getElementById(`nav-btn-${newMode}`) || document.querySelector(`.nav-btn[onclick*="${newMode}"]`);
  if (targetBtn) targetBtn.classList.add('active');

  document.querySelectorAll('.mode-container').forEach(div => div.classList.remove('active'));

  if (newMode === 'wrongBook') {
    appState.currentMode = 'wrongBook';
    const wbMode = document.getElementById('wrongBook-mode');
    if (wbMode) wbMode.classList.add('active');
    document.getElementById('summary-area').style.display = 'none';
    renderWrongBook();
    return;
  }

  const targetModeDiv = document.getElementById(`${newMode}-mode`);
  if (targetModeDiv) targetModeDiv.classList.add('active');

  if (modeStates[newMode]) {
    const saved = modeStates[newMode];
    appState = {
      currentMode: saved.appState.currentMode,
      deck: [...saved.appState.deck],
      nextRoundDeck: [...saved.appState.nextRoundDeck],
      currentIndex: saved.appState.currentIndex,
      stats: { ...saved.appState.stats },
      isQuizAnswered: saved.appState.isQuizAnswered,
      hasVisitedBack: saved.appState.hasVisitedBack,
      round: saved.appState.round,
      startTime: saved.appState.startTime ? new Date(saved.appState.startTime) : new Date(),
      isWrongTraining: saved.appState.isWrongTraining
    };

    const prefix = newMode === 'flashcard' ? 'fc' : 'mq';
    const badge = document.getElementById(`${prefix}-round-badge`);
    if (badge) {
      if (saved.badgeText) badge.innerText = saved.badgeText;
      if (saved.badgeBg) badge.style.backgroundColor = saved.badgeBg;
    }

    if (saved.summaryVisible) {
      document.getElementById(`${prefix}-game-area`).style.display = 'none';
      document.getElementById('summary-area').style.display = 'block';
      document.getElementById('summary-text').innerHTML = saved.summaryText;
      const statusEl = document.getElementById('sending-status');
      if (statusEl) statusEl.innerText = saved.sendingStatus;
    } else {
      document.getElementById('summary-area').style.display = 'none';
      document.getElementById(`${prefix}-game-area`).style.display = 'block';

      if (newMode === 'flashcard') {
        loadFlashcard();
        if (saved.cardFlipped) {
          document.getElementById('card').classList.add('flipped');
        }
        if (saved.frontActionsVisible) {
          document.getElementById('front-actions').classList.add('visible');
          document.getElementById('fc-hint').style.opacity = '0';
        }
      } else if (newMode === 'meaningQuiz') {
        if (appState.currentIndex < appState.deck.length) {
          loadQuiz();
        }
      }
    }
    updateStatsUI();
  } else {
    initGame(newMode, false);
  }
}

function updateStatsUI() { 
  const mode = appState.currentMode;
  let prefix = mode === 'flashcard' ? 'fc' : 'mq'; 

  if (mode === 'flashcard') { 
    const knownEl = document.getElementById('fc-known-count');
    const unknownEl = document.getElementById('fc-unknown-count');
    const leftEl = document.getElementById('fc-left-count');
    if (knownEl) knownEl.innerText = appState.stats.good; 
    if (unknownEl) unknownEl.innerText = appState.stats.bad; 
    if (leftEl) {
      const left = appState.deck.length - appState.currentIndex;
      leftEl.innerText = left > 0 ? left : 0; 
    }
  } else if (mode === 'meaningQuiz') { 
    const correctEl = document.getElementById('mq-correct-count');
    const wrongEl = document.getElementById('mq-wrong-count');
    const leftEl = document.getElementById('mq-left-count');
    if (correctEl) correctEl.innerText = appState.stats.good; 
    if (wrongEl) wrongEl.innerText = appState.stats.bad; 
    if (leftEl) {
      const left = appState.deck.length - appState.currentIndex;
      leftEl.innerText = left > 0 ? left : 0; 
    }
  } 
}

function loadFlashcard() { 
  const card = appState.deck[appState.currentIndex]; 
  if(!card) return; 

  document.getElementById('fc-char').innerText = card.idiom; 
  document.getElementById('front-actions').classList.remove('visible'); 
  document.getElementById('fc-hint').style.opacity = '1'; 
  
  document.getElementById('fc-back-char').innerText = card.idiom; 
  document.getElementById('fc-meaning').innerText = card.meaning; 
  document.getElementById('fc-sentence').innerText = card.sentence; 
  
  document.getElementById('card').classList.remove('flipped'); 
  appState.hasVisitedBack = false; 
  document.getElementById('fc-game-area').style.display = 'block'; 
  updateStatsUI();
}

function flipCard() { 
  const cardEl = document.getElementById('card'); 
  const isFlippingToBack = !cardEl.classList.contains('flipped'); 
  cardEl.classList.toggle('flipped'); 
  if (isFlippingToBack) appState.hasVisitedBack = true; 
  else if (appState.hasVisitedBack) { 
    document.getElementById('front-actions').classList.add('visible'); 
    document.getElementById('fc-hint').style.opacity = '0'; 
  } 
}

function rateCard(isKnown) { 
  const currentCard = appState.deck[appState.currentIndex];
  if (isKnown) {
    appState.stats.good++; 
    if (appState.isWrongTraining && isAutoRemoveEnabled() && currentCard) {
      removeFromWrongBook(currentCard.idiom || currentCard.word || currentCard.key);
    }
  } else { 
    appState.stats.bad++; 
    if (currentCard) {
      addToWrongBook(currentCard);
      appState.nextRoundDeck.push(currentCard); 
    }
  } 
  appState.currentIndex++; 
  updateStatsUI(); 
  if (appState.currentIndex < appState.deck.length) setTimeout(() => loadFlashcard(), 200); 
  else showSummary(); 
}

function loadQuiz() { 
  const currentItem = appState.deck[appState.currentIndex]; 
  if (!currentItem) return;
  const prefix = 'mq'; 
  appState.isQuizAnswered = false; 
  document.getElementById(`${prefix}-next-btn`).style.display = 'none'; 
  document.getElementById(`${prefix}-feedback`).innerText = ''; 
  
  document.getElementById('mq-question').innerText = currentItem.meaning; 
  
  const container = document.getElementById(`${prefix}-options`); 
  container.innerHTML = ''; 
  
  let options = [currentItem.idiom];
  let allIdioms = vocabData.map(i => i.idiom);
  while (options.length < 4) {
      let rand = allIdioms[Math.floor(Math.random() * allIdioms.length)];
      if (!options.includes(rand)) options.push(rand);
  }
  options = shuffleArray(options);
  
  options.forEach(optText => { 
    const btn = document.createElement('div'); 
    btn.className = 'option-btn'; 
    btn.innerHTML = `<div>${optText}</div>`; 
    btn.onclick = () => checkAnswer(btn, optText, currentItem); 
    container.appendChild(btn); 
  }); 
  document.getElementById(`${prefix}-game-area`).style.display = 'block'; 
  updateStatsUI();
}

function checkAnswer(btn, selectedValue, currentItem) { 
  if (appState.isQuizAnswered) return; 
  appState.isQuizAnswered = true; 
  const prefix = 'mq'; 
  
  const correctAnswer = currentItem.idiom;
  const isCorrect = selectedValue === correctAnswer;
  
  let feedbackText = "";
  if (isCorrect) { 
    btn.classList.add('correct'); 
    feedbackText = "✅ 答對了！"; 
    document.getElementById(`${prefix}-feedback`).style.color = "var(--success)"; 
    appState.stats.good++; 
    if (appState.isWrongTraining && isAutoRemoveEnabled() && currentItem) {
      removeFromWrongBook(currentItem.idiom || currentItem.word || currentItem.key);
    }
  } else { 
    btn.classList.add('wrong'); 
    feedbackText = `❌ 答錯了。正確答案是：${correctAnswer}`; 
    document.getElementById(`${prefix}-feedback`).style.color = "var(--danger)"; 
    appState.stats.bad++; 
    if (currentItem) {
      addToWrongBook(currentItem);
      appState.nextRoundDeck.push(currentItem); 
    }
  } 
  
  document.getElementById(`${prefix}-feedback`).innerText = feedbackText;

  const container = document.getElementById(`${prefix}-options`); 
  Array.from(container.children).forEach(child => { 
    if (child.innerText === correctAnswer) { child.classList.add('correct'); } 
  }); 
  
  updateStatsUI(); 
  document.getElementById(`${prefix}-next-btn`).style.display = 'block'; 
}

function nextQuiz() { 
  appState.currentIndex++; 
  if (appState.currentIndex < appState.deck.length) loadQuiz(); 
  else showSummary(); 
}

function showSummary() { 
   const prefix = appState.currentMode === 'flashcard' ? 'fc' : 'mq'; 
   document.getElementById(`${prefix}-game-area`).style.display = 'none'; 
   document.getElementById('summary-area').style.display = 'block'; 
   window.scrollTo(0, 0); 
   
   const endTime = new Date(); 
   const durationSeconds = Math.floor((endTime - appState.startTime) / 1000); 
   const minutes = Math.floor(durationSeconds / 60); 
   const seconds = durationSeconds % 60; 
   const durationStr = `${minutes}分${seconds}秒`;
   
   const summaryText = document.getElementById('summary-text'); 
   const restartBtn = document.getElementById('btn-retry'); 
   let msg = ""; 
   msg += `<div style="margin-bottom:15px; font-size:16px; color:#78909c;">⏱️ 本次練習時間：${durationStr}</div>`;
   if (appState.currentMode === 'flashcard') { 
     msg += `本輪掌握：<b style="color:var(--success)">${appState.stats.good}</b> 個<br>需複習：<b style="color:var(--warning)">${appState.stats.bad}</b> 個`; 
   } else { 
     msg += `答對：<b style="color:var(--success)">${appState.stats.good}</b><br>答錯：<b style="color:var(--danger)">${appState.stats.bad}</b>`; 
   } 
   
   if (appState.nextRoundDeck.length === 0) { 
     msg += `<br><br><b>✨ 太棒了！全部通過！✨</b>`; 
     restartBtn.innerText = "🏆 重新開始全部"; 
     restartBtn.onclick = resetAll; 
   } else { 
     msg += `<br><br>還有 <b>${appState.nextRoundDeck.length}</b> 個不熟，繼續特訓！`; 
     restartBtn.innerText = "🔄 複習不熟的內容"; 
     restartBtn.onclick = restartRound; 
   } 
   summaryText.innerHTML = msg; 
}



function restartRound() { initGame(appState.currentMode, true); }
function resetAll() { initGame(appState.currentMode, false); }

document.addEventListener('DOMContentLoaded', () => {
   document.title = QUIZ_TITLE;
   document.querySelector('h1').innerText = QUIZ_TITLE;
   document.getElementById('inst-title-text').innerText = QUIZ_TITLE;
   document.getElementById('welcome-title-text').innerText = QUIZ_TITLE;
});
</script>
</body>
</html>
